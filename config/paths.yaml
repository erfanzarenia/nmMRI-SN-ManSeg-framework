# All machine-specific paths live here.
#
# Each subject belongs to a POOL. A pool defines where its data lives and which
# subject list it draws from. The labeled and study datasets are separate and
# may sit on different filesystems, so each pool has its own data_root. A pool
# spread over several datasets lists them all; each subject's image is looked
# up in those roots in order.
#
# Source layout per pool (set with `layout`):
#   bids -> per-subject sub-dirs, e.g. <subject>/anat/<subject>_acq-NM_T1w.nii.gz
#   flat -> every file directly in data_root, e.g. <subject>.nii.gz
# `layout` only sets default file patterns; override them per pool with explicit
# image_pattern / expert_mask_pattern (relative to data_root, "{subject}" is the
# BIDS label; any other pool key can be used too, e.g. "{run:02d}"). Globs ("*")
# and .nii / .nii.gz are both accepted; inputs are normalized to gzip-compressed
# .nii.gz when the workspace is built.

pools:
  # Labeled set (training, phases 1-4): Echo 1 NM images + expert SN masks.
  labeled:
    data_root: /path/to/labeled_dataset
    layout: flat
    image_pattern: "{subject}/NM_echo1*.nii"
    expert_mask_pattern: "{subject}/NM_echo1*_SN.nii.gz"
    subjects: subjects_labeled.txt

  # SNIT study set (SNIT calibration + production): the regular NM combined-echo
  # ("combo echo") image, not Echo 1. Adults and adolescents are separate BIDS
  # datasets. `run` selects the NM run (1 or 2) for every subject.
  study:
    data_root:
      - /path/to/study_bids_adults
      - /path/to/study_bids_adolescents
    layout: bids
    run: 1
    image_pattern: "{subject}/anat/{subject}_acq-CombEchoNM_run-{run:02d}_GRE.nii.gz"
    expert_mask_pattern: null
    subjects: subjects_study.csv

# Where the multi-rater segmentation workspace is built (outside the repo).
workspace_root: /path/to/ManSeg_Workspace

# Where QC metrics and summaries are written.
qc_output_root: /path/to/ManSeg_Workspace/qc
