# Phase definitions, split seed, and workspace ID naming for the SN workflow.
# split_subjects.py and make_workspace.py read this file.
#
# seed       Deterministic-random subject -> phase/rater assignment. The same
#            seed reproduces the same draws; override with --seed.
# id_prefix  Prefix for the anonymized workspace subject IDs.
# id_width   Zero-padded width of the workspace ID counter.
#            Workspace scans are RELABELED (e.g. sub-0001) so their IDs do not
#            match the source scan IDs, which keeps raters blind. The
#            workspace -> source key is written to config/subjects_split.json
#            (kept private; never shared with raters).
#
# The split is append-only: once config/subjects_split.json exists, every phase
# in it keeps its subjects and IDs (matched by name, so a renumbered phase keeps
# them) and split_subjects.py allocates only phases that are new here. Raters
# added to raters.json get every shared phase's subjects; a partitioned phase is
# re-divided only with `split_subjects.py --repartition phaseN`, which keeps its
# subjects' IDs and leaves each subject with any rater who already has output
# files for it; for an `n_subjects: all` phase it also follows the pool list
# (new subjects get new IDs, unlisted ones without outputs are dropped).
# `--rebalance phaseN` is the gentler option for a phase in progress: same
# subjects and overlap, as few moves as possible (see split_subjects.py).
# `--defer phaseN` adds the raters now and divides that phase later.
#
# Each phaseN block:
#   name        slug for the workspace folder -> phaseN_<name>
#   pool        pool to draw from (must match a pool in paths.yaml)
#   n_subjects  number to draw at random, or "all" for the remainder
#   subjects    instead of n_subjects: explicit source IDs from the pool. They
#               are not drawn from it, so they may also sit in a drawn phase.
#   assignment  shared      -> every rater gets the same subjects
#               partitioned -> subjects divided across raters
#   overlap     partitioned only: fraction [0..1) of the phase's subjects, or a
#               number of subjects (>= 1), also given to EVERY rater (hidden
#               repeats) for reliability monitoring
#   overlap_subjects
#               partitioned only: source IDs that must be in the overlap; the
#               rest of it is picked at random among subjects with an image
#   raters      optional: only these raters (from raters.json) get the phase
#   balance_by  partitioned only, optional: a column of the pool's subject CSV
#               (e.g. age_group); the overlap is split evenly across its values
#               and each rater gets a near-equal share of each value
#   expert_mask place an expert_mask alongside each image (pool must define
#               expert_mask_pattern)
#   attempts    1 -> outputs/<sub>/<rater>_mask.nii.gz
#               N -> outputs/<sub>/<rater>_mask_a1 .. _aN.nii.gz
#   runs        optional: acquisitions per subject, e.g. [1, 2]; a subject missing
#               one simply has fewer. Inputs are inputs/<sub>/image_run_<N>.nii.gz,
#               masks outputs/<sub>/<rater>_mask_run_<N>.nii.gz. Without it each
#               subject has one image.nii.gz, of the pool's `run`
#   labels      labels segmented, all in one mask file (values as in
#               docs/SN_label_definition.txt): SN = 1, CP = 2 (cerebral
#               peduncle reference region, from Phase 3). Default: [SN]
#   criteria    optional per-rater pass criteria, checked by qc_protocol.py
#               (see docs/qc.md)

seed: 7
id_prefix: "sub-"
id_width: 4

phase1:
  name: playground
  pool: labeled
  n_subjects: 2
  assignment: shared
  expert_mask: true
  attempts: 2
  labels: [SN]

phase2:
  name: practice
  pool: labeled
  n_subjects: 7
  assignment: shared
  expert_mask: true
  attempts: 2
  labels: [SN]

phase3:
  name: mock_exam
  pool: labeled
  n_subjects: 7
  assignment: shared
  expert_mask: false
  attempts: 1
  labels: [SN, CP]

phase4:
  name: exam
  pool: labeled
  n_subjects: 12
  assignment: shared
  expert_mask: false
  attempts: 1
  labels: [SN, CP]

phase5:
  name: snit_calibration
  pool: study
  # Fixed calibration scans, as source IDs from the pool.
  subjects: [sub-1001, sub-1002, sub-1003, sub-5001, sub-5002]
  assignment: shared
  expert_mask: false
  attempts: 1
  labels: [SN, CP]
  criteria:
    sn_dice_min: 0.60     # median over scans of SN Dice vs the other raters
    sn_hd95_max_mm: 3.0   # median over scans of SN HD95 vs the other raters
    sn_volume_tol: 0.30   # SN volume within this fraction of the scan median...
    cp_mean_tol: 0.05     # CP mean intensity within this fraction of the scan median...
    min_scans: 4          # ...on at least this many of the calibration scans

phase6:
  name: production
  pool: study
  n_subjects: all
  assignment: partitioned
  overlap: 15                   # subjects that go to every rater
  overlap_subjects: [sub-1001, sub-5001]  # optional: must be in the overlap
  raters: [R1, R2, R3]           # optional: only these raters segment production
  runs: [1, 2]                   # every NM acquisition of a subject
  run1_only: []                  # optional: subjects kept to run 1
  echoes: [combo, echo]          # per run: combined echoes (image_pattern) and Echo 1
  balance_by: age_group          # split the overlap evenly between age groups
  expert_mask: false
  attempts: 1
  labels: [SN, CP]
