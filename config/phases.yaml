# Phase definitions, split seed, and workspace ID naming for the SN workflow.
# split_subjects.py and make_workspace.py read this file.
#
# seed       Deterministic-random subject -> phase/rater assignment. The same
#            seed reproduces the same draws; override with --seed.
# id_prefix  Prefix for the anonymized workspace subject IDs.
# id_width   Zero-padded width of the workspace ID counter.
#            Workspace scans are RELABELED (e.g. sub-0001) so their IDs do not
#            match the source scan IDs, which keeps raters blind. The
#            workspace -> source key is written to config/subjects_split.json
#            (kept private; never shared with raters).
#
# The split is append-only: once config/subjects_split.json exists, every phase
# in it keeps its subjects and IDs (matched by name, so a renumbered phase keeps
# them) and split_subjects.py allocates only phases that are new here.
#
# Each phaseN block:
#   name        slug for the workspace folder -> phaseN_<name>
#   pool        pool to draw from (must match a pool in paths.yaml)
#   n_subjects  number to draw at random, or "all" for the remainder
#   subjects    instead of n_subjects: explicit source IDs from the pool. They
#               are not drawn from it, so they may also sit in a drawn phase.
#   assignment  shared      -> every rater gets the same subjects
#               partitioned -> subjects divided across raters
#   overlap     partitioned only: fraction [0..1] of the phase's subjects also
#               given to EVERY rater (hidden repeats) for reliability monitoring
#   expert_mask place an expert_mask alongside each image (pool must define
#               expert_mask_pattern)
#   attempts    1 -> outputs/<sub>/<rater>_mask.nii.gz
#               N -> outputs/<sub>/<rater>_mask_a1 .. _aN.nii.gz
#   labels      labels segmented, all in one mask file (values as in
#               docs/SN_label_definition.txt): SN = 1, CP = 2 (cerebral
#               peduncle reference region, from Phase 3). Default: [SN]

seed: 7
id_prefix: "sub-"
id_width: 4

phase1:
  name: playground
  pool: labeled
  n_subjects: 2
  assignment: shared
  expert_mask: true
  attempts: 2
  labels: [SN]

phase2:
  name: practice
  pool: labeled
  n_subjects: 7
  assignment: shared
  expert_mask: true
  attempts: 2
  labels: [SN]

phase3:
  name: mock_exam
  pool: labeled
  n_subjects: 7
  assignment: shared
  expert_mask: false
  attempts: 1
  labels: [SN, CP]

phase4:
  name: exam
  pool: labeled
  n_subjects: 12
  assignment: shared
  expert_mask: false
  attempts: 1
  labels: [SN, CP]

phase5:
  name: production
  pool: study
  n_subjects: all
  assignment: partitioned
  overlap: 0.15
  expert_mask: false
  attempts: 1
  labels: [SN, CP]
